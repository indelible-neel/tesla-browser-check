<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Browser Check</title>
<style>
  :root { --bg:#0a0a0b; --panel:#15151a; --line:#2a2a31; --ink:#f5f5f2; --muted:#a6a6ad; --ok:#4cc38a; --bad:#f06a5e; --warn:#e3a94b; --accent:#3d5bff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:20px; }
  h1 { margin:0; font-size:30px; }
  p { margin:0; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:12px; }
  button { font:inherit; font-size:22px; padding:18px 26px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.45; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
  td { padding:10px 14px; border-top:1px solid var(--line); vertical-align:top; }
  td:first-child { width:38%; color:var(--muted); }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; } .warn { color:var(--warn); font-weight:600; }
  .meter { height:28px; background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .meter div { height:100%; width:0%; background:var(--ok); transition:width .05s; }
  code { font-family:ui-monospace, Menlo, monospace; font-size:14px; color:var(--muted); word-break:break-all; }
  #log { white-space:pre-wrap; font-family:ui-monospace, Menlo, monospace; font-size:14px; color:var(--muted); background:var(--panel); border:1px solid var(--line); padding:12px; max-height:220px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>Tesla browser check</h1>
  <p>Tap the buttons in order: once parked, then again while driving. Take a photo of this screen each time.</p>

  <div class="row">
    <button class="primary" id="b-mic">1. Allow microphone</button>
    <button id="b-rec" disabled>2. Record 6 seconds</button>
    <button id="b-play" disabled>3. Play recording</button>
    <button id="b-tone">4. Play test tone</button>
    <button id="b-rtc">5. Test WebRTC</button>
    <button id="b-voice">6. Play a voice clip (watch the ambient lights)</button>
  </div>

  <div>
    <p>Mic level (talk from the back seat and watch this bar)</p>
    <div class="meter"><div id="lvl"></div></div>
  </div>

  <table id="t"></table>
  <div id="log"></div>
</main>
<script>
(function () {
  const rows = {};
  const t = document.getElementById('t');
  const logEl = document.getElementById('log');
  function log(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
  function set(key, label, value, cls) {
    let r = rows[key];
    if (!r) { r = t.insertRow(); r.insertCell(); r.insertCell(); rows[key] = r; }
    r.cells[0].textContent = label;
    r.cells[1].innerHTML = '';
    const s = document.createElement('span'); s.textContent = value; if (cls) s.className = cls; r.cells[1].appendChild(s);
  }
  const yes = (b) => b ? ['yes', 'ok'] : ['no', 'bad'];
  function ua() {
    set('ua', 'Browser', navigator.userAgent, '');
    set('secure', 'Secure page (https)', ...yes(window.isSecureContext));
    set('md', 'navigator.mediaDevices', ...yes(!!navigator.mediaDevices));
    set('gum', 'getUserMedia (microphone API)', ...yes(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)));
    set('rtc', 'RTCPeerConnection (WebRTC)', ...yes(!!window.RTCPeerConnection));
    set('ac', 'AudioContext (web audio)', ...yes(!!(window.AudioContext || window.webkitAudioContext)));
    set('mr', 'MediaRecorder', ...yes(!!window.MediaRecorder));
    set('ws', 'WebSocket', ...yes(!!window.WebSocket));
    set('tts', 'speechSynthesis (built-in TTS)', ...yes(!!window.speechSynthesis));
    set('asr', 'SpeechRecognition (built-in STT)', ...yes(!!(window.SpeechRecognition || window.webkitSpeechRecognition)));
    set('wl', 'Wake lock (keep screen on)', ...yes(!!(navigator.wakeLock)));
    try {
      const c = navigator.mediaDevices && navigator.mediaDevices.getSupportedConstraints ? navigator.mediaDevices.getSupportedConstraints() : {};
      set('aec', 'Echo cancellation / noise suppression supported', (c.echoCancellation ? 'EC yes' : 'EC no') + ', ' + (c.noiseSuppression ? 'NS yes' : 'NS no') + ', ' + (c.autoGainControl ? 'AGC yes' : 'AGC no'), c.echoCancellation ? 'ok' : 'warn');
    } catch (e) { set('aec', 'Echo cancellation support', 'error: ' + e.name, 'bad'); }
    set('screen', 'Screen', screen.width + ' x ' + screen.height + ' @' + (window.devicePixelRatio || 1) + 'x', '');
  }
  ua();

  let stream = null, chunks = [], recUrl = null, actx = null;
  document.getElementById('b-mic').onclick = async function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { set('micres', 'Microphone access', 'API missing: the browser has no microphone support', 'bad'); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      const tr = stream.getAudioTracks()[0];
      set('micres', 'Microphone access', 'GRANTED: ' + (tr.label || '(no label)'), 'ok');
      try { set('micset', 'Mic settings in effect', JSON.stringify(tr.getSettings()), ''); } catch (e) {}
      try {
        const devs = await navigator.mediaDevices.enumerateDevices();
        set('devs', 'Audio devices', devs.filter(d => d.kind.startsWith('audio')).map(d => d.kind + ': ' + (d.label || '?')).join(' | ') || 'none listed', '');
      } catch (e) {}
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        actx = actx || new AC();
        const src = actx.createMediaStreamSource(stream), an = actx.createAnalyser(); an.fftSize = 1024; src.connect(an);
        const buf = new Uint8Array(an.fftSize), bar = document.getElementById('lvl');
        (function tick() { an.getByteTimeDomainData(buf); let m = 0; for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128)); bar.style.width = Math.min(100, m / 128 * 180) + '%'; requestAnimationFrame(tick); })();
      }
      document.getElementById('b-rec').disabled = !window.MediaRecorder;
    } catch (e) {
      set('micres', 'Microphone access', 'FAILED: ' + e.name + ' ' + (e.message || ''), 'bad');
      log('getUserMedia error: ' + e.name + ': ' + e.message);
    }
  };
  document.getElementById('b-rec').onclick = function () {
    if (!stream) return;
    chunks = [];
    let mr;
    try { mr = new MediaRecorder(stream); } catch (e) { set('recres', 'Recording', 'FAILED: ' + e.name, 'bad'); return; }
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => { recUrl = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType })); set('recres', 'Recording', 'done (' + mr.mimeType + '), tap Play', 'ok'); document.getElementById('b-play').disabled = false; };
    mr.start(); set('recres', 'Recording', 'recording... talk now', 'warn');
    setTimeout(() => mr.stop(), 6000);
  };
  document.getElementById('b-play').onclick = function () { if (recUrl) { const a = new Audio(recUrl); a.play().then(() => set('playres', 'Playback', 'playing (listen for your voice)', 'ok')).catch(e => set('playres', 'Playback', 'FAILED: ' + e.name, 'bad')); } };
  document.getElementById('b-tone').onclick = function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { set('tone', 'Test tone', 'no web audio', 'bad'); return; }
    actx = actx || new AC(); actx.resume && actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 440; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(); setTimeout(() => o.stop(), 1200);
    set('tone', 'Test tone', 'played 1.2 s at 440 Hz: did it come out of the car speakers?', 'warn');
  };
  document.getElementById('b-voice').onclick = function () { const a = new Audio('voice.m4a'); a.play().then(() => set('voice', 'Voice clip (39 s)', 'playing: do the ambient lights pulse with the voice? (Light Sync on in Toybox)', 'warn')).catch(e => set('voice', 'Voice clip', 'FAILED: ' + e.name, 'bad')); };
  document.getElementById('b-rtc').onclick = async function () {
    if (!window.RTCPeerConnection) { set('rtcres', 'WebRTC offer', 'no RTCPeerConnection', 'bad'); return; }
    try {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      if (stream) stream.getTracks().forEach(tk => pc.addTrack(tk, stream)); else pc.addTransceiver('audio');
      let cands = 0; pc.onicecandidate = e => { if (e.candidate) cands++; };
      const off = await pc.createOffer(); await pc.setLocalDescription(off);
      setTimeout(() => { set('rtcres', 'WebRTC offer + network candidates', 'offer ok, ' + cands + ' candidates' + (/opus/i.test(off.sdp) ? ', Opus codec' : ''), cands ? 'ok' : 'warn'); pc.close(); }, 3000);
    } catch (e) { set('rtcres', 'WebRTC offer', 'FAILED: ' + e.name + ' ' + e.message, 'bad'); }
  };
})();
</script>
</body>
</html>
